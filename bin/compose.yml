# HTTP Proxy Stack - Production Ready Configuration
# This demonstrates how to use the published images from GitHub Container Registry
#
# Usage:
#   Basic HTTP Proxy:
#     docker compose up -d
#
#   With Monitoring (Prometheus + Grafana):
#     docker compose --profile metrics up -d
#
#   With tailnet peer routing:
#     HTTP_PROXY_TAILSCALE_ENABLED=true docker compose --profile tailscale up -d
#
#   With specific image tag:
#     HTTP_PROXY_DOCKER_IMAGE_TAG=v1.2.3 docker compose up -d
#
# Access:
#   - Traefik Dashboard: http://localhost:30000
#   - DNS Server: UDP/TCP port 19322
#   - HTTP Proxy: Port 80
#   - HTTPS Proxy: Port 443 (manual configuration required)
#   - Grafana (optional): http://localhost:30001 (admin/admin)
#   - Prometheus (optional): http://localhost:9090

services:
  dinghy_layer:
    image: ghcr.io/sparkfabrik/http-proxy-services:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamic:/traefik/dynamic
    command: ["sh", "-c", "/usr/local/bin/dinghy-layer"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    labels:
      - "traefik.enable=false"
    restart: always

  join_networks:
    image: ghcr.io/sparkfabrik/http-proxy-services:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      ["sh", "-c", "/usr/local/bin/join-networks -container-name http-proxy"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    labels:
      - "traefik.enable=false"
    restart: always

  dns:
    image: ghcr.io/sparkfabrik/http-proxy-services:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    ports:
      - "19322:19322/udp"
      - "19322:19322/tcp"
    command: ["sh", "-c", "/usr/local/bin/dns-server"]
    environment:
      - HTTP_PROXY_DNS_TLDS=${HTTP_PROXY_DNS_TLDS:-loc}
      - HTTP_PROXY_DNS_TARGET_IP=${HTTP_PROXY_DNS_TARGET_IP:-127.0.0.1}
      - HTTP_PROXY_DNS_PORT=${HTTP_PROXY_DNS_PORT:-19322}
      - HTTP_PROXY_DNS_FORWARD_ENABLED=${HTTP_PROXY_DNS_FORWARD_ENABLED:-false}
      - HTTP_PROXY_DNS_UPSTREAM_SERVERS=${HTTP_PROXY_DNS_UPSTREAM_SERVERS:-8.8.8.8:53,1.1.1.1:53}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    labels:
      - "traefik.enable=false"
    restart: always

  # Tailnet peer routing, started with spark-http-proxy start-with-tailscale.
  # The daemon socket is added by compose.tailscale-socket.yml.
  tailscale_peers:
    image: ghcr.io/sparkfabrik/http-proxy-services:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    volumes:
      - traefik_dynamic:/traefik/dynamic
      - "${HOME}/.local/spark/http-proxy/state:/state"
    # Runs as PID 1, receiving the SIGTERM that makes it withdraw its routes.
    command: ["/usr/local/bin/tailscale-peers"]
    environment:
      - HTTP_PROXY_TAILSCALE_ENABLED=${HTTP_PROXY_TAILSCALE_ENABLED:-false}
      - HTTP_PROXY_TAILSCALE_SOURCE=${HTTP_PROXY_TAILSCALE_SOURCE:-socket}
      - HTTP_PROXY_TAILSCALE_REFRESH_INTERVAL=${HTTP_PROXY_TAILSCALE_REFRESH_INTERVAL:-60s}
      - HTTP_PROXY_TAILSCALE_STATUS_MAX_AGE=${HTTP_PROXY_TAILSCALE_STATUS_MAX_AGE:-10m}
      - HTTP_PROXY_TAILSCALE_SOCKET=${HTTP_PROXY_TAILSCALE_SOCKET:-/var/run/tailscale/tailscaled.sock}
      - HTTP_PROXY_TAILSCALE_STATUS_FILE=${HTTP_PROXY_TAILSCALE_STATUS_FILE:-/state/tailscale-status.json}
      - HTTP_PROXY_TAILSCALE_STATE_FILE=${HTTP_PROXY_TAILSCALE_STATE_FILE:-/state/tailscale-peers.json}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    labels:
      - "traefik.enable=false"
    restart: always
    profiles:
      - tailscale

  traefik:
    image: ghcr.io/sparkfabrik/http-proxy-traefik:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    container_name: http-proxy
    ports:
      - "80:80"
      - "443:443"
      - "30000:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik_dynamic:/traefik/dynamic
      - "${HOME}/.local/spark/http-proxy/certs:/traefik/certs:ro"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Read by the entrypoint, which clears peer routes when they are disabled
      - HTTP_PROXY_TAILSCALE_ENABLED=${HTTP_PROXY_TAILSCALE_ENABLED:-false}
    labels:
      - "traefik.enable=false"
    restart: always

  prometheus:
    image: ghcr.io/sparkfabrik/http-proxy-prometheus:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    container_name: http-proxy-prometheus
    ports:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=false"
    restart: always
    profiles:
      - metrics

  grafana:
    image: ghcr.io/sparkfabrik/http-proxy-grafana:${HTTP_PROXY_DOCKER_IMAGE_TAG:-latest}
    container_name: http-proxy-grafana
    ports:
      - "30001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/traefik-official.json
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "traefik.enable=false"
    depends_on:
      - prometheus
    restart: always
    profiles:
      - metrics

volumes:
  traefik_dynamic:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: http-proxy_default
