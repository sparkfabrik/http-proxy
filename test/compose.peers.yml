# Test override for tailnet peer routing.
#
# The status document is synthetic and read through the file source, which is
# the transport macOS uses in production, so the ownership filter runs during
# the test rather than being bypassed by it. The state directory is the test's
# own, so a run never writes into the developer's.
services:
  tailscale_peers:
    environment:
      - HTTP_PROXY_TAILSCALE_ENABLED=true
      - HTTP_PROXY_TAILSCALE_SOURCE=file
      - HTTP_PROXY_TAILSCALE_REFRESH_INTERVAL=2s
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./test/state:/state
